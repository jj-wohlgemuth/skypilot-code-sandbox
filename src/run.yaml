name: joschkas_clowd

resources:
  cloud: aws
  # AWS billing tags for Cost Explorer attribution (ML-868). Top-level so they
  # apply to every any_of candidate and survive launch.sh's --instance-type /
  # --gpus overrides. Applied on FIRST launch only — a running cluster is never
  # retroactively tagged, so `sky down` before the tags matter.
  labels:
    Application: DATA_ENGINEERING
    Environment: Research
    Layer: Compute
    Managed-by: SkyPilot
    Team: MLEngineering
  # REGION ALLOWLIST. SkyPilot has no global "allowed regions" config key (only
  # allowed_clouds), so the allowlist is exactly the set of regions named below:
  # nothing outside it can ever be provisioned. Because of that, launch.sh must
  # NOT pass --infra — it overrides these entries and silently re-opens every
  # AWS region.
  #
  # `ordered` (not any_of) means this is a preference list tried top to bottom,
  # so us-east-1 stays the default and the rest are genuine fallbacks for when
  # a type is capacity-constrained. any_of would instead pick the cheapest
  # candidate, which on a price tie drifts into another region for no reason.
  #
  # Default profile: data engineering (many CPUs, high network throughput) —
  # the cross product of allowed regions x those instance types, cheapest type
  # first, since ordered/any_of entries are alternatives and cannot be given as
  # two combinable lists. Combinations AWS does not offer are reported and
  # skipped, not fatal. (Disabled data types: c6in.8xlarge, m5n.8xlarge.)
  #
  # For a cheap Claude box or a GPU machine (a10/l4), launch via ./launch.sh —
  # its --instance-type/--gpus flags replace the type in every entry below and
  # leave the regions intact, so both the allowlist and the order still hold.
  ordered:
    - {region: us-east-1, instance_type: c6i.4xlarge}
    - {region: us-east-1, instance_type: m5n.4xlarge}
    - {region: us-east-1, instance_type: m6in.4xlarge}
    - {region: us-east-1, instance_type: m5zn.6xlarge}
    - {region: us-east-2, instance_type: c6i.4xlarge}
    - {region: us-east-2, instance_type: m5n.4xlarge}
    - {region: us-east-2, instance_type: m6in.4xlarge}
    - {region: us-east-2, instance_type: m5zn.6xlarge}
    - {region: us-west-2, instance_type: c6i.4xlarge}
    - {region: us-west-2, instance_type: m5n.4xlarge}
    - {region: us-west-2, instance_type: m6in.4xlarge}
    - {region: us-west-2, instance_type: m5zn.6xlarge}
    - {region: eu-west-1, instance_type: c6i.4xlarge}
    - {region: eu-west-1, instance_type: m5n.4xlarge}
    - {region: eu-west-1, instance_type: m6in.4xlarge}
    - {region: eu-west-1, instance_type: m5zn.6xlarge}
    - {region: eu-central-1, instance_type: c6i.4xlarge}
    - {region: eu-central-1, instance_type: m5n.4xlarge}
    - {region: eu-central-1, instance_type: m6in.4xlarge}
    - {region: eu-central-1, instance_type: m5zn.6xlarge}
    - {region: ap-northeast-2, instance_type: c6i.4xlarge}
    - {region: ap-northeast-2, instance_type: m5n.4xlarge}
    - {region: ap-northeast-2, instance_type: m6in.4xlarge}
    - {region: ap-northeast-2, instance_type: m5zn.6xlarge}

file_mounts:
  /bucket_data:
    source: r2://joschkas-clowd/ # or GCS, or Azure Blob Storage, or R2, etc.
  ~/.aws/config: ~/.aws/config
  ~/.env: .env

workdir: src

setup: |
  # Source .env in interactive shells
  grep -qxF 'set -a && source ~/.env && set +a' ~/.bashrc || echo 'set -a && source ~/.env && set +a' >> ~/.bashrc

  # Install uv
  curl -LsSf https://astral.sh/uv/install.sh | sh

  # Install gh CLI for PR creation
  if ! command -v gh >/dev/null 2>&1; then
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    sudo apt update && sudo apt install -y gh
  fi

  # Git auth via GH_TOKEN (fine-grained PAT in ~/.env) — no SSH keys on the VM.
  # gh reads GH_TOKEN from the env; setup-git routes git's HTTPS credentials
  # through gh, so plain `git push`/`pull` on github.com clones just work.
  set -a && source ~/.env && set +a
  gh auth setup-git 2>/dev/null || true

  # Git defaults (adapted from anilkeshwani/dotfiles)
  git config --global user.name "jj-wohlgemuth"
  git config --global user.email "52459869+jj-wohlgemuth@users.noreply.github.com"
  git config --global init.defaultBranch main
  git config --global push.autoSetupRemote true
  git config --global diff.algorithm histogram
  git config --global merge.conflictstyle diff3

  # Global gitignore: never commit OS junk or local Claude settings
  mkdir -p ~/.config/git
  printf '.DS_Store\n**/.claude/settings.local.json\n' > ~/.config/git/ignore

  # Pre-commit hook in every clone: the VM starts from fresh clones on each
  # relaunch, and `pre-commit install` is per-clone — a git template dir
  # pre-installs the hook at clone time so repo hooks always run.
  export PATH="$HOME/.local/bin:$PATH"
  uv tool install pre-commit
  git config --global init.templateDir ~/.git-template
  pre-commit init-templatedir ~/.git-template

  # tmux QoL (adapted from anilkeshwani/dotfiles): mouse support, new
  # splits/windows inherit the current pane's working directory
  cat > ~/.tmux.conf <<'TMUX'
  set-option -g mouse on
  set-option -g history-file ~/.tmux_history
  bind '"' split-window -c "#{pane_current_path}"
  bind % split-window -h -c "#{pane_current_path}"
  bind c new-window -c "#{pane_current_path}"
  TMUX

  # Setup re-runs on relaunch; a tmux server that is already up keeps its old
  # options, so reload the conf into it explicitly (no-op if none is running).
  command -v tmux >/dev/null 2>&1 && tmux source-file ~/.tmux.conf 2>/dev/null || true

  # Terminfo for uv-installed Python TUIs (nvitop etc.): uv's python-build-
  # standalone bundles an ncurses that misses Debian's terminfo locations
  grep -qxF 'export TERMINFO_DIRS="/etc/terminfo:/lib/terminfo:/usr/share/terminfo"' ~/.bashrc || \
    echo 'export TERMINFO_DIRS="/etc/terminfo:/lib/terminfo:/usr/share/terminfo"' >> ~/.bashrc

  # Install Claude Code
  curl -fsSL https://claude.ai/install.sh | bash || true

  # Install AWS CLI v2 (v1 doesn't support SSO)
  if ! aws --version 2>&1 | grep -q 'aws-cli/2'; then
    curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    unzip -q /tmp/awscliv2.zip -d /tmp
    sudo /tmp/aws/install --update
    rm -rf /tmp/awscliv2.zip /tmp/aws
  fi

  # Install build tools (gcc required for packages like pesq) and bubblewrap
  # (required by Claude Code's bash sandbox, enabled in claude-settings.json)
  sudo apt-get update && sudo apt-get install -y gcc build-essential bubblewrap

  # Install ffmpeg
  if ! command -v ffmpeg >/dev/null 2>&1; then
    sudo apt-get install -y ffmpeg
  fi

  # Brand font (Milling Duplex 1mm) for the wer-bar-chart skill plots. The .otf
  # lives in R2 (not in git — commercial 205TF license); install system-wide and
  # drop a copy in ~/sky_workdir, which is one of the skill's hardcoded
  # font-candidate paths.
  if [ -f /bucket_data/fonts/205TF-Milling-Duplex1mm.otf ]; then
    mkdir -p ~/.local/share/fonts
    cp /bucket_data/fonts/205TF-Milling-Duplex1mm.otf ~/.local/share/fonts/
    fc-cache -f >/dev/null 2>&1 || true
    cp /bucket_data/fonts/205TF-Milling-Duplex1mm.otf ~/sky_workdir/205TF-Milling-Duplex1mm.otf
  else
    echo "WARN: brand font not found at /bucket_data/fonts/205TF-Milling-Duplex1mm.otf"
  fi

  # Install rclone for R2-backed Claude memory
  if ! command -v rclone >/dev/null 2>&1; then
    curl https://rclone.org/install.sh | sudo bash
  fi

  # Configure rclone for R2
  set -a && source ~/.env && set +a
  # R2 redirects http:// to https://, but the first hop would still go out in
  # the clear (path + signed headers), so refuse a non-TLS endpoint outright.
  case "$R2_ENDPOINT" in https://*) ;; *) echo "ERROR: R2_ENDPOINT must be https:// (got '$R2_ENDPOINT')" >&2; exit 1 ;; esac
  mkdir -p ~/.config/rclone
  printf '[r2]\ntype = s3\nprovider = Cloudflare\naccess_key_id = %s\nsecret_access_key = %s\nendpoint = %s\n' \
    "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$R2_ENDPOINT" > ~/.config/rclone/rclone.conf

  # Mount R2 claude-memory/ to ~/.claude/ (persistent shared memory + Claude Code OAuth credentials)
  mkdir -p ~/.claude
  grep -qxF 'rclone mount r2:joschkas-clowd/claude-memory ~/.claude --daemon --allow-non-empty --vfs-cache-mode full' ~/.bashrc || \
    echo 'rclone mount r2:joschkas-clowd/claude-memory ~/.claude --daemon --allow-non-empty --vfs-cache-mode full' >> ~/.bashrc

  # Wait for the mount before any interactive shell continues, so `claude` writes
  # credentials into the R2-backed dir (not the local empty one).
  grep -qxF '{ for _ in $(seq 1 50); do mountpoint -q ~/.claude && break; sleep 0.1; done; }' ~/.bashrc || \
    echo '{ for _ in $(seq 1 50); do mountpoint -q ~/.claude && break; sleep 0.1; done; }' >> ~/.bashrc

  # Surface CLAUDE.md from any cwd: symlink workdir copy to $HOME
  ln -sf ~/sky_workdir/CLAUDE.md ~/CLAUDE.md

  # VSCode Machine settings (apply to all remote workspaces on this VM):
  # - every integrated terminal starts in ~/sky_workdir
  # - "Claude" terminal profile: lands in a tmux session running `claude`
  #   in ~/sky_workdir/ (pick it from the terminal dropdown). Default
  #   profile stays plain bash.
  # Always overwritten — this repo is the source of truth.
  mkdir -p ~/.vscode-server/data/Machine
  cat > ~/.vscode-server/data/Machine/settings.json <<'JSON'
  {
    "terminal.integrated.cwd": "/home/ubuntu/sky_workdir",
    "terminal.integrated.profiles.linux": {
      "Claude": {
        "path": "bash",
        "args": ["-lc", "cd ~/sky_workdir && tmux new -A -s claude claude"],
        "icon": "robot"
      },
      "bash": {
        "path": "bash"
      }
    }
  }
  JSON

run: |
  set -a && source ~/.env && set +a

  # Mount shared Claude memory from R2
  mkdir -p ~/.claude
  rclone mount r2:joschkas-clowd/claude-memory ~/.claude --daemon --allow-non-empty --vfs-cache-mode full

  # Wait for mount, then install/refresh ai-coustics agent-skills marketplace.
  # Private repo — cloned over HTTPS; git credentials come from GH_TOKEN via the
  # gh credential helper configured in setup. Plugin state lands under ~/.claude/
  # which is R2-backed, so a fresh VM with a populated R2 bucket already has the
  # skills.
  for _ in $(seq 1 50); do mountpoint -q ~/.claude && break; sleep 0.1; done
  export PATH="$HOME/.local/bin:$PATH"
  if mountpoint -q ~/.claude && command -v claude >/dev/null 2>&1; then
    claude plugin marketplace add https://github.com/ai-coustics/agent-skills 2>/dev/null || true
    # add is a no-op when the marketplace is already registered, so update
    # explicitly to pull the latest plugin layout.
    claude plugin marketplace update ai-coustics-agent-skills 2>/dev/null || true
    # Since agent-skills #28 the repo is one plugin per skill — the old
    # umbrella plugin "ai-coustics" no longer exists. Remove any stale install
    # of it (its cached copy shadows the new per-skill plugins with old code).
    claude plugin uninstall ai-coustics@ai-coustics-agent-skills 2>/dev/null || true
    for plugin in aic-eval-dataset aic-wer-run before-after chatterbox-revoice \
        enhance estimate-snr-brouhaha fetch-sample-audio ffmpeg-audio-toolkit \
        kokoro score-perceptual-quality transcribe tyto wer-bar-chart word-timestamps; do
      claude plugin install "$plugin@ai-coustics-agent-skills" 2>/dev/null || \
        echo "plugin install failed: $plugin"
    done
    claude plugin marketplace add https://github.com/skypilot-org/skypilot 2>/dev/null || true
    claude plugin install skypilot@skypilot 2>/dev/null || true
  fi

  # Claude Code settings (permissions allowlist, sandbox, auto mode) — source of
  # truth is claude-settings.json in this repo; installed into the R2-backed
  # ~/.claude/ on every boot, so repo edits win over ad-hoc VM edits.
  if mountpoint -q ~/.claude; then
    cp ~/sky_workdir/claude-settings.json ~/.claude/settings.json
  fi

  # Install personal skills (deslop + excalidraw) and reviewer agents from
  # anilkeshwani/dotfiles. ~/.claude/ is R2-backed so they persist; re-sync
  # each boot for updates.
  if mountpoint -q ~/.claude; then
    rm -rf /tmp/ak-dotfiles
    if git clone --depth 1 --filter=blob:none --sparse https://github.com/anilkeshwani/dotfiles.git /tmp/ak-dotfiles 2>/dev/null; then
      git -C /tmp/ak-dotfiles sparse-checkout set home/.claude/skills home/.claude/agents
      mkdir -p ~/.claude/skills ~/.claude/agents
      for s in deslop-code deslop-prose excalidraw; do
        rm -rf ~/.claude/skills/$s
        cp -r /tmp/ak-dotfiles/home/.claude/skills/$s ~/.claude/skills/
      done
      for a in architect-reviewer researcher-reviewer senior-mle-reviewer; do
        cp /tmp/ak-dotfiles/home/.claude/agents/$a.md ~/.claude/agents/
      done
    fi
    rm -rf /tmp/ak-dotfiles

    # visual-explainer skill (nicobailon), latest main. The repo has moved the
    # skill around (root -> plugins/visual-explainer/), so locate SKILL.md.
    rm -rf /tmp/visual-explainer
    if git clone --quiet --depth 1 https://github.com/nicobailon/visual-explainer.git /tmp/visual-explainer 2>/dev/null; then
      ve_src=$(dirname "$(find /tmp/visual-explainer -name SKILL.md -not -path '*/.git/*' | head -1)")
      if [ -f "$ve_src/SKILL.md" ]; then
        rm -rf ~/.claude/skills/visual-explainer
        cp -r "$ve_src" ~/.claude/skills/visual-explainer
      fi
    fi
    rm -rf /tmp/visual-explainer
  fi

  # VSCode extensions for the remote server. The code-server binary only exists
  # after the first VSCode connect, so install in the background once it appears
  # (waits up to ~2h). --force makes this idempotent; the list below is the
  # source of truth and additions here land on the next launch.
  VSCODE_EXTENSIONS="charliermarsh.ruff ms-python.python ms-python.vscode-pylance ms-python.debugpy ms-python.vscode-python-envs redhat.vscode-yaml tamasfe.even-better-toml yzhang.markdown-all-in-one davidanson.vscode-markdownlint mechatroner.rainbow-csv zainchen.json fabiospampinato.vscode-diff ms-vscode.makefile-tools lanly-dev.spectrogram sukumo28.wav-preview xueshiqiao.avprobe techer.open-in-browser twixes.pypi-assistant vscode-aws-console.vscode-aws-console"
  (
    for _ in $(seq 1 720); do
      code_bin=$(ls -d ~/.vscode-server/bin/*/bin/code-server ~/.vscode-server/cli/servers/*/server/bin/code-server 2>/dev/null | head -1)
      [ -n "$code_bin" ] && break
      sleep 10
    done
    if [ -n "$code_bin" ]; then
      for ext in $VSCODE_EXTENSIONS; do
        "$code_bin" --install-extension "$ext" --force 2>/dev/null || echo "vscode ext install failed: $ext"
      done
    fi
  ) &

  echo "VM boot complete — SSH in and run claude from ~/sky_workdir"
